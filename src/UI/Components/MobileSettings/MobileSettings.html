<div id="MobileSettings">
	<div class="titlebar">
		<span class="title">Mobile Settings</span>
		<button class="close" type="button">✕</button>
	</div>
	<div class="body">
		<label class="row">
			<span>Haptics</span>
			<input id="ms-haptics" type="checkbox" />
		</label>
		<label class="row">
			<span>UI scale</span>
			<select id="ms-uiscale">
				<option value="off">Off</option>
				<option value="0.9">90%</option>
				<option value="0.8">80%</option>
				<option value="0.7">70%</option>
				<option value="auto">Auto</option>
			</select>
		</label>
		<label class="row">
			<span>Auto-reconnect</span>
			<input id="ms-reconnect" type="checkbox" />
		</label>
		<label class="row">
			<span>Left-handed layout</span>
			<input id="ms-lefthanded" type="checkbox" />
		</label>
		<p class="hint">Auto-reconnect applies to the next connection.</p>
	</div>
</div>
